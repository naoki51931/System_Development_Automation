name: staging-readiness-quality-gate
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: quality, POSTGRES_USER: quality, POSTGRES_PASSWORD: local-ci-only}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U quality" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://quality:local-ci-only@localhost:5432/quality
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-quality.txt
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Undefined symbols
        run: ruff check . --select F821,F822,F823
      - name: Compile/import check
        run: python -m compileall -q app tests scripts
      - name: Backend tests and coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=json:quality-results/backend-coverage.json --cov-fail-under=80
          python scripts/check_service_coverage.py quality-results/backend-coverage.json --minimum 90
      - name: Migration and OpenAPI generated diff
        run: |
          alembic upgrade head
          python scripts/export_openapi.py
          git diff --exit-code -- schemas/openapi.yaml
      - name: Security and secret scans
        run: |
          bandit -q -r app
          pip-audit -r requirements.txt
          python scripts/secret_scan.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run openapi:check
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run test:coverage
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        name: npm audit (network failures are BLOCKED, never PASS)
        run: |
          set +e
          npm audit --omit=dev --json > ../quality-results/npm-audit-ci.json
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::npm audit failed or was BLOCKED by registry/DNS access (exit $code)"
            exit "$code"
          fi
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., target: runtime, push: false, cache-from: "type=gha,scope=backend", cache-to: "type=gha,mode=max,scope=backend"}
      - uses: docker/build-push-action@v6
        with: {context: frontend, target: runtime, push: false, cache-from: "type=gha,scope=frontend", cache-to: "type=gha,mode=max,scope=frontend"}
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d postgres backend frontend worker
      - run: docker compose exec -T backend python -m app.quality.seed_e2e
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - working-directory: frontend
        run: |
          npx playwright test --project=chromium
          npx playwright test --project=firefox
          npx playwright test --project=webkit
      - name: Compose smoke test
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = 200
  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d postgres backend
      - run: docker compose exec -T backend python -m app.quality.seed_performance
      - name: 50-user local performance gate
        run: |
          docker compose run --rm -v perf-results:/results backend locust -f performance/locustfile.py --headless -H http://backend:8000 -u 50 -r 10 -t 60s --csv /results/quality --only-summary
          docker compose run --rm -v perf-results:/results backend python - <<'PY'
          import csv
          rows = list(csv.DictReader(open('/results/quality_stats.csv')))
          failures = sum(int(row['Failure Count']) for row in rows if row['Name'] != 'Aggregated')
          requests = sum(int(row['Request Count']) for row in rows if row['Name'] != 'Aggregated')
          normal = max(float(row['95%']) for row in rows if row['Name'].startswith('normal:'))
          listing = max(float(row['95%']) for row in rows if row['Name'].startswith('list:'))
          assert failures / max(requests, 1) < 0.01, (failures, requests)
          assert normal <= 500, normal
          assert listing <= 1000, listing
          PY
  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - working-directory: environment
        run: terraform init -backend=false && terraform validate
      - working-directory: bootstrap
        run: terraform init -backend=false && terraform validate
