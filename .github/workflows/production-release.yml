name: production-release

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Successful protected production-migration-evidence run ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-plan:
    name: Verify evidence and create full Production plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control-plane
          persist-credentials: false
      - name: Bind release to current protected master
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "naoki51931/System_Development_Automation"
          test "$GITHUB_REF" = "refs/heads/master"
          test "${#RELEASE_SHA}" -eq 40
          case "$RELEASE_SHA" in (*[!0-9a-f]*) exit 1;; esac
          git -C control-plane fetch --no-tags origin master
          git -C control-plane merge-base --is-ancestor "$RELEASE_SHA" origin/master
          test "$RELEASE_SHA" = "$(git -C control-plane rev-parse origin/master)"
          test "$RELEASE_SHA" = "$(git -C control-plane rev-parse HEAD)"
      - name: Checkout immutable release tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: release-tree
          persist-credentials: false
      - name: Verify release checkout identity
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$(git -C release-tree rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Verify trusted producer run
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$PRODUCER_RUN_ID" in (''|*[!0-9]*) exit 1;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" > "$RUNNER_TEMP/producer-run.json"
          jq -e --arg sha "$RELEASE_SHA" '
            .conclusion == "success" and
            .status == "completed" and
            .event == "workflow_dispatch" and
            .head_branch == "master" and
            .head_sha == $sha and
            .path == ".github/workflows/production-migration-evidence.yml" and
            (.run_attempt | type == "number" and . > 0)
          ' "$RUNNER_TEMP/producer-run.json"
          run_attempt="$(jq -r .run_attempt "$RUNNER_TEMP/producer-run.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/attempts/$run_attempt/jobs" \
            > "$RUNNER_TEMP/producer-jobs.json"
          jq -e '
            [.jobs[] | select(
              .name == "Produce signed migration and Alembic evidence" and
              .status == "completed" and .conclusion == "success"
            )] | length == 1
          ' "$RUNNER_TEMP/producer-jobs.json"
          printf 'run_attempt=%s\n' "$run_attempt" >> "$GITHUB_OUTPUT"
      - name: Download fixed producer artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/production-evidence"
          gh run download "$PRODUCER_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name production-migration-attestation --dir "$RUNNER_TEMP/production-evidence"
          test -f "$RUNNER_TEMP/production-evidence/migration-attestation.json"
          test -f "$RUNNER_TEMP/production-evidence/alembic-verification.json"
          test ! -L "$RUNNER_TEMP/production-evidence/migration-attestation.json"
          test ! -L "$RUNNER_TEMP/production-evidence/alembic-verification.json"
      - name: Verify trust chain and create sole Terraform handoff
        env:
          RELEASE_SHA: ${{ github.sha }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          python -m pip install --requirement control-plane/requirements-runtime.txt
          install -d -m 700 release-tree/environment/.production-release
          test ! -L release-tree/environment/.production-release
          python control-plane/scripts/verify_production_migration_attestation.py \
            --attestation-file "$RUNNER_TEMP/production-evidence/migration-attestation.json" \
            --alembic-evidence-file "$RUNNER_TEMP/production-evidence/alembic-verification.json" \
            --approved-release-sha "$RELEASE_SHA" \
            --expected-producer-run-id "$PRODUCER_RUN_ID" \
            --expected-producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --output release-tree/environment/.production-release/verified-attestation.json
          test ! -L release-tree/environment/.production-release/verified-attestation.json
          test "$(stat -c '%a' release-tree/environment/.production-release/verified-attestation.json)" = "600"
      - name: Native isolated Terraform safety tests
        run: |
          set -euo pipefail
          terraform -chdir=control-plane/tests/terraform/production_release_gate_fixture init -backend=false
          terraform -chdir=control-plane/tests/terraform/production_release_gate_fixture test
      - name: Reverify freshness immediately before full plan
        env:
          RELEASE_SHA: ${{ github.sha }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          python control-plane/scripts/verify_production_migration_attestation.py \
            --attestation-file "$RUNNER_TEMP/production-evidence/migration-attestation.json" \
            --alembic-evidence-file "$RUNNER_TEMP/production-evidence/alembic-verification.json" \
            --approved-release-sha "$RELEASE_SHA" \
            --expected-producer-run-id "$PRODUCER_RUN_ID" \
            --expected-producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --output release-tree/environment/.production-release/verified-attestation.json
      - name: Materialize protected Terraform configuration
        env:
          BACKEND_HCL: ${{ secrets.PRODUCTION_TERRAFORM_BACKEND_HCL }}
          TFVARS_JSON: ${{ secrets.PRODUCTION_TERRAFORM_TFVARS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKEND_HCL"
          test -n "$TFVARS_JSON"
          printf '%s' "$BACKEND_HCL" > "$RUNNER_TEMP/backend.hcl"
          printf '%s' "$TFVARS_JSON" > "$RUNNER_TEMP/production.auto.tfvars.json"
      - name: Create full Production saved plan
        working-directory: release-tree/environment
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          terraform init -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform validate
          terraform plan -var-file="$RUNNER_TEMP/production.auto.tfvars.json" \
            -var="approved_release_sha=$RELEASE_SHA" \
            -var="enable_release_runtime=true" \
            -out="$RUNNER_TEMP/production-release.tfplan"
          terraform show -json "$RUNNER_TEMP/production-release.tfplan" \
            > "$RUNNER_TEMP/production-release-plan.json"
      - name: Bind saved plan review metadata
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python control-plane/scripts/create_production_plan_metadata.py \
            --release-sha "$RELEASE_SHA" \
            --handoff release-tree/environment/.production-release/verified-attestation.json \
            --plan "$RUNNER_TEMP/production-release.tfplan" \
            --plan-json "$RUNNER_TEMP/production-release-plan.json" \
            --output "$RUNNER_TEMP/production-release-plan-metadata.json"
          chmod 600 "$RUNNER_TEMP/production-release.tfplan" "$RUNNER_TEMP/production-release-plan-metadata.json"
      - name: Encrypt reviewed saved plan
        env:
          PRODUCTION_PLAN_ENCRYPTION_KEY_B64: ${{ secrets.PRODUCTION_PLAN_ENCRYPTION_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          python control-plane/scripts/encrypt_production_saved_plan.py \
            --input "$RUNNER_TEMP/production-release.tfplan" \
            --output "$RUNNER_TEMP/production-release.tfplan.enc"
      - name: Upload encrypted reviewed saved plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-plan-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-release.tfplan.enc
            ${{ runner.temp }}/production-release-plan-metadata.json
          if-no-files-found: error
          retention-days: 1

# Deliberately no apply job. A future protected apply workflow may consume only
# the reviewed saved plan whose SHA-256 matches production-release-plan-metadata.json.
